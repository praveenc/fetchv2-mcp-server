<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 581 898" width="581" height="898" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Arial, Helvetica, &quot;Liberation Sans&quot;, sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" aria-labelledby="pele-fetch-confirmation--title" aria-describedby="pele-fetch-confirmation--desc"><style>svg.pele{--pele-bg:#ffffff;--pele-fg:#1f2328;--pele-muted:#59636e;--pele-line:#59636e;--pele-surface:#f6f8fa;--pele-surface-alt:#eff2f5;--pele-border:#d1d9e0;--pele-accent:#0969da;--pele-critical:#cf222e;--pele-series-1:#0969da;--pele-series-2:#bc4c00;--pele-series-3:#1a7f37;--pele-series-4:#cf222e;--pele-series-5:#8250df;--pele-series-6:#9a6700;--pele-series-7:#bf3989;--pele-series-8:#1b7c83;--pele-font:Arial, Helvetica, "Liberation Sans", sans-serif;background:var(--pele-bg)}.pele-node.ok > :first-child { fill: var(--pele-series-3); stroke: var(--pele-series-3); }
.pele-node.ok .pele-label { fill: var(--pele-bg); }
.pele-node.stop > :first-child { stroke: var(--pele-critical); stroke-width: 2px; }</style><title id="pele-fetch-confirmation--title">How fetch decides whether to fetch a page</title><desc id="pele-fetch-confirmation--desc">The private network guard checks every request first and never prompts. Then fetch checks robots.txt, unless bypass_robots_txt is true. If robots.txt disallows the URL and the client can show a form, the user is asked. Accept fetches the page. Decline or cancel returns Not fetched. A client without forms gets the robots.txt error.</desc><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_start_guard_0"><path d="M180.37,56L180.37,97"/><path class="pele-marker" d="M180.37,104L177.01,96L183.73,96Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_guard_refuse_0"><path d="M171.83,199.79C171.83,212.71 67.34,212.71 67.34,225.63L67.34,317.32"/><path class="pele-marker" d="M67.34,324.32L63.98,316.32L70.7,316.32Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_guard_robots_0"><path d="M188.91,199.79C188.91,212.71 293.39,212.71 293.39,225.63L293.39,271.13"/><path class="pele-marker" d="M293.39,278.13L290.03,270.13L296.75,270.13Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_robots_md_0"><path d="M257.37,414C257.37,461.75 162.54,461.75 162.54,509.51L162.54,834.53"/><path class="pele-marker" d="M162.54,841.53L159.18,833.53L165.9,833.53Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_robots_form_0"><path d="M363.85,392.48L363.85,502.51"/><path class="pele-marker" d="M363.85,509.51L360.49,501.51L367.21,501.51Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_form_err_0"><path d="M346.24,618.52C346.24,634.28 264.69,634.28 264.69,650.03L264.69,704.53"/><path class="pele-marker" d="M264.69,711.53L261.33,703.53L268.05,703.53Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_form_ask_0"><path d="M381.46,618.52C381.46,634.28 463,634.28 463,650.03L463,695.53"/><path class="pele-marker" d="M463,702.53L459.64,694.53L466.36,694.53Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_ask_md_0"><path d="M412.43,768.53L412.43,814.03C412.43,818.33 192.55,825.1 192.55,829.41L192.55,834.53"/><path class="pele-marker" d="M192.55,841.53L189.19,833.53L195.91,833.53Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_ask_skip_0"><path d="M513.58,768.53L513.58,834.53"/><path class="pele-marker" d="M513.58,841.53L510.22,833.53L516.94,833.53Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="L_guard_refuse_0"><rect x="55.56" y="227.63" width="23.57" height="21" rx="3" fill="var(--_bg)"/><text x="67.34" y="243.03" text-anchor="middle">no</text></g><g class="pele-edge-label" data-id="L_guard_robots_0"><rect x="278.5" y="227.63" width="29.78" height="21" rx="3" fill="var(--_bg)"/><text x="293.39" y="243.03" text-anchor="middle">yes</text></g><g class="pele-edge-label" data-id="L_robots_md_0"><rect x="147.65" y="559.02" width="29.78" height="21" rx="3" fill="var(--_bg)"/><text x="162.54" y="574.42" text-anchor="middle">yes</text></g><g class="pele-edge-label" data-id="L_robots_form_0"><rect x="352.06" y="459.01" width="23.57" height="21" rx="3" fill="var(--_bg)"/><text x="363.85" y="474.41" text-anchor="middle">no</text></g><g class="pele-edge-label" data-id="L_form_err_0"><rect x="252.9" y="652.03" width="23.57" height="21" rx="3" fill="var(--_bg)"/><text x="264.69" y="667.43" text-anchor="middle">no</text></g><g class="pele-edge-label" data-id="L_form_ask_0"><rect x="448.11" y="652.03" width="29.78" height="21" rx="3" fill="var(--_bg)"/><text x="463" y="667.43" text-anchor="middle">yes</text></g><g class="pele-edge-label" data-id="L_ask_md_0"><rect x="387.81" y="791.03" width="49.24" height="21" rx="3" fill="var(--_bg)"/><text x="412.43" y="806.43" text-anchor="middle">accept</text></g><g class="pele-edge-label" data-id="L_ask_skip_0"><rect x="457.05" y="791.03" width="113.04" height="21" rx="3" fill="var(--_bg)"/><text x="513.58" y="806.43" text-anchor="middle">decline or cancel</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-stadium" data-id="start" transform="translate(180.37,32)"><rect x="-57.56" y="-24" width="115.12" height="48" rx="24" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">fetch(url)</text></g><g class="pele-node pele-shape-diam" data-id="guard" transform="translate(180.37,154.57)"><polygon points="0,-50.56 80.9,0 0,50.57 -80.9,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">Public</tspan><tspan x="0" y="16.1">address?</tspan></text></g><g class="pele-node pele-shape-rect stop" data-id="refuse" transform="translate(67.34,357.32)"><rect x="-59.34" y="-33" width="118.69" height="66" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">Refused</tspan><tspan x="0" y="16.1">(no prompt)</tspan></text></g><g class="pele-node pele-shape-diam" data-id="robots" transform="translate(293.39,357.32)"><polygon points="0,-79.19 126.7,0 0,79.19 -126.7,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">robots.txt allows it,</tspan><tspan x="0" y="16.1">or bypass_robots_txt?</tspan></text></g><g class="pele-node pele-shape-stadium ok" data-id="md" transform="translate(170.54,865.53)"><rect x="-86.02" y="-24" width="172.03" height="48" rx="24" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Clean Markdown</text></g><g class="pele-node pele-shape-diam" data-id="form" transform="translate(363.85,569.52)"><polygon points="0,-60.01 96.02,0 0,60.01 -96.02,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">Client can</tspan><tspan x="0" y="16.1">show a form?</tspan></text></g><g class="pele-node pele-shape-rect stop" data-id="err" transform="translate(264.69,735.53)"><rect x="-70.02" y="-24" width="140.03" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">robots.txt error</text></g><g class="pele-node pele-shape-lean-r" data-id="ask" transform="translate(463,735.53)"><polygon points="-71.8,-33 88.3,-33 71.8,33 -88.3,33" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">Ask the user:</tspan><tspan x="0" y="16.1">Fetch anyway?</tspan></text></g><g class="pele-node pele-shape-rect stop" data-id="skip" transform="translate(513.58,865.53)"><rect x="-58.91" y="-24" width="117.82" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Not fetched</text></g></g></svg>
