name: Publish release

on:
  release:
    types: [published]

env:
  MCP_PUBLISHER_VERSION: "1.8.1"
  MCP_PUBLISHER_LINUX_AMD64_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Verify release versions
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          project_version="$(uv version --short)"
          registry_version="$(jq -r '.version' server.json)"
          package_version="$(
            jq -r \
              '.packages[] | select(.identifier == "fetchv2-mcp-server") | .version' \
              server.json
          )"

          test "$release_version" = "$project_version"
          test "$release_version" = "$registry_version"
          test "$release_version" = "$package_version"

      - name: Run tests
        run: uv run pytest -q

      - name: Build package
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    if: github.event.release.prerelease == false
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-registry:
    if: github.event.release.prerelease == false
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Wait for PyPI metadata
        run: |
          version="${GITHUB_REF_NAME#v}"
          marker="mcp-name: io.github.praveenc/fetchv2-mcp-server"

          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              "https://pypi.org/pypi/fetchv2-mcp-server/${version}/json" \
              --output /tmp/pypi.json \
              && jq --exit-status --arg version "$version" --arg marker "$marker" \
                '.info.version == $version and (.info.description | contains($marker))' \
                /tmp/pypi.json >/dev/null; then
              exit 0
            fi

            sleep 10
          done

          echo "PyPI metadata or MCP ownership marker was not available." >&2
          exit 1

      - name: Install mcp-publisher
        run: |
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/${archive}" \
            --output "$archive"
          echo "${MCP_PUBLISHER_LINUX_AMD64_SHA256}  ${archive}" | sha256sum --check
          tar xzf "$archive" mcp-publisher
          chmod +x mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish server.json
